<!-- Hobby filter pill row, #370 replacement of project-tag pills.
     Expects `top_tags` (hobby pills: {slug, name, id}), `selected_tag_slug`
     (selected hobby's slug, or None for "All"), `show_reference_pill`, and
     `show_reference_selected` in scope (passed through automatically by
     Jinja's include context-sharing). -->
<div class="tag-chip-row-wrap">
  <div class="tag-chip-row">
    <a class="tag-chip{% if not selected_tag_slug and not show_reference_selected %} active{% endif %}" href="/" title="All projects">All</a>
    {% for t in top_tags %}
    <a class="tag-chip{% if selected_tag_slug == t.slug %} active{% endif %}" href="/?hobby={{ t.slug }}" title="{{ t.name }}">{{ t.name }}</a>
    {% endfor %}
    {% if show_reference_pill %}
    <a class="tag-chip{% if show_reference_selected %} active{% endif %}" href="/?ref=1" title="Reference material">Reference</a>
    {% endif %}
  </div>
</div>
