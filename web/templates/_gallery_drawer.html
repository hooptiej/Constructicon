<!-- Upload pop-out — home page only, hides behind a tab on the right edge
     (avatar + owner name) and reveals on mouse-over or drag-over. Originally
     #17's combined gallery + upload panel; the embedded gallery section
     (its own duplicated ~885-line copy of gallery-browsing markup/JS) was
     removed once the Unfiled page, home page's own Files widget, and the
     standalone /gallery page made it redundant — this is upload-only now,
     same content as _upload_drawer.html (used by every other page) but
     reached via hover/drag instead of a click. Other pages (gallery.html,
     account.html, object_detail.html, project_detail.html, user_gallery.html)
     are unaffected — they keep the click-triggered _upload_drawer.html.

     Timing/easing (0.2s ease, transform+opacity) is picked to sit between
     _upload_drawer.html's original slide (0.22s ease) and _admin_pane.html's
     popover (#24, 0.18s ease) so the two pop-out surfaces on this page read
     as one family despite different shapes/triggers: admin pane is a small
     click-toggled popover bottom-right, this is a hover/drag-revealed full
     -height edge panel on the right-middle. No shared backdrop dim, matching
     admin pane's no-backdrop convention (a full-page dim on every mouse
     hover would be obnoxious) — closing happens on mouse-leave, drag-leave,
     Escape, or (once opened by a click) an outside click. -->
<div class="gallery-drawer-tab" id="gallery-drawer-tab" title="Upload" role="button" tabindex="0">
  <div class="gallery-drawer-avatar">{{ owner_initials }}</div>
  <span class="gallery-drawer-name">{{ owner_name }}</span>
</div>
<div class="gallery-drawer" id="gallery-drawer">
  <div>
    <h2 class="gallery-drawer-section-title">Upload</h2>
    <form id="upload-form">
      <p class="error-text" id="upload-error" style="display:none;margin-bottom:12px"></p>
      <button class="btn-primary" type="submit" id="submit-btn" style="margin-bottom:14px" disabled>Ingest to Constructicon</button>
      <label class="dropzone" id="dropzone" for="file-input">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 16V6M12 6L8 10M12 6L16 10" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 17H6.5C4.567 17 3 15.433 3 13.5C3 11.766 4.257 10.325 5.912 10.052C6.278 7.749 8.267 6 10.667 6C12.822 6 14.66 7.403 15.29 9.35" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 17H17.5C19.433 17 21 15.433 21 13.5C21 11.766 19.743 10.325 18.088 10.052" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="dropzone-text" id="dropzone-text">Drag files here or click to browse</div>
        <div class="dropzone-hint">PNG, JPG, PDF, STL, PSD, SVG, EPS, or audio (MP3/M4A/OGG/WAV) up to 25MB — drop multiple at once</div>
        <input type="file" id="file-input" name="file" accept=".png,.jpg,.jpeg,.pdf,.stl,.psd,.svg,.eps,.mp3,.m4a,.ogg,.wav" multiple style="display:none">
      </label>
      <div class="divider" style="margin:14px 0">
        <div class="line"></div><span>OR</span><div class="line"></div>
      </div>
      <div class="field">
        <label>LINK</label>
        <div class="youtube-add-row">
          <input class="input mono" id="youtube-url-input" placeholder="Any URL — a YouTube link, or any other web page">
          <button type="button" class="btn-secondary" id="youtube-add-btn">Add</button>
        </div>
      </div>
      <div class="field">
        <!-- Issue #200, mirrored from _upload_drawer.html -->
        <button type="button" class="btn-secondary" id="imgur-import-btn" style="width:100%">Import from Imgur</button>
        <div class="dropzone-hint" id="imgur-import-status" style="margin-top:6px"></div>
      </div>
      <div id="staged-files-container" class="staged-files-container">
        <div id="staged-list"></div>
        <div id="staged-more-indicator" class="staged-more-indicator" style="display:none"></div>
      </div>
      <div class="meta-form">
        <div class="field">
          <label>DESCRIPTION</label>
          <textarea class="input" name="description" rows="3" placeholder="What does this show?"></textarea>
        </div>
        <div class="field">
          <label>TAGS</label>
          <div class="tag-input-box" id="upload-tag-box">
            <input class="tag-add-input" id="upload-tag-add-input" placeholder="+ Add tag, press Enter" autocomplete="off">
            <div class="tag-suggestions" id="upload-tag-suggestions" style="display:none"></div>
          </div>
        </div>
        <div class="field">
          <label>PROJECT <span class="optional">(optional)</span></label>
          <select class="input" id="upload-project-select">
            <option value="">No project</option>
          </select>
          <input class="input mono" id="upload-new-project-input" placeholder="New project name" style="display:none;margin-top:6px">
        </div>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  // --- Pop-out open/close state machine (#17) ---------------------------
  // Open whenever any of: pinned (explicit click, or an active/staged
  // upload), dragging (a file is being dragged over the window), or the
  // mouse is actually over the tab/panel. mouseleave/dragleave don't close
  // immediately — they schedule a check shortly after, so moving the mouse
  // from the tab into the panel (or briefly outside during a drag) doesn't
  // flicker it shut.
  const tab = document.getElementById('gallery-drawer-tab');
  const panel = document.getElementById('gallery-drawer');
  const headerUploadTrigger = document.getElementById('upload-trigger'); // from _header.html, if present
  let pinned = false;
  let dragging = false;
  let closeTimer = null;

  function showPanel() {
    clearTimeout(closeTimer);
    panel.classList.add('open');
    tab.classList.add('active');
  }
  function scheduleHide(delay) {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
      if (pinned || dragging) return;
      if (tab.matches(':hover') || panel.matches(':hover')) return;
      panel.classList.remove('open');
      tab.classList.remove('active');
    }, delay === undefined ? 220 : delay);
  }
  function togglePinned() {
    pinned = !pinned;
    if (pinned) showPanel(); else scheduleHide(0);
  }

  tab.addEventListener('mouseenter', showPanel);
  tab.addEventListener('mouseleave', () => scheduleHide());
  tab.addEventListener('click', togglePinned);
  tab.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePinned(); } });
  panel.addEventListener('mouseenter', () => clearTimeout(closeTimer));
  panel.addEventListener('mouseleave', () => scheduleHide());
  if (headerUploadTrigger) headerUploadTrigger.addEventListener('click', togglePinned);

  document.addEventListener('click', (e) => {
    if (!pinned) return;
    // Ignore the click that just opened it — the tab's own click handler
    // (or the header's Upload button, which lives outside both tab and
    // panel) already ran togglePinned() for this same event before it
    // bubbles up here.
    if (panel.contains(e.target) || tab.contains(e.target)) return;
    if (headerUploadTrigger && headerUploadTrigger.contains(e.target)) return;
    pinned = false;
    scheduleHide(0);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    pinned = false;
    dragging = false;
    scheduleHide(0);
  });

  // The whole window is a drop target — dragging a file in from anywhere
  // reveals this pop-out (same depth-counter technique _upload_drawer.html
  // used for its own drag-to-open, retargeted at this combined panel so
  // drag-over behaves the same as it always has, just landing here now).
  let dragDepth = 0;
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    dragging = true;
    showPanel();
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) {
      dragging = false;
      scheduleHide();
    }
  });
  // Folder drop (#134), mirrored from _upload_drawer.html — see that file
  // for the full reasoning (flattened single project per top-level folder,
  // reusing an existing same-named project, only the first folder in a
  // multi-item drop is handled this way).
  function readAllEntries(dirReader) {
    return new Promise((resolve, reject) => {
      let all = [];
      (function readBatch() {
        dirReader.readEntries((entries) => {
          if (!entries.length) { resolve(all); return; }
          all = all.concat(entries);
          readBatch();
        }, reject);
      })();
    });
  }

  async function walkDirectory(dirEntry) {
    const files = [];
    async function walk(entry) {
      if (entry.isFile) {
        files.push(await new Promise((resolve, reject) => entry.file(resolve, reject)));
      } else if (entry.isDirectory) {
        for (const child of await readAllEntries(entry.createReader())) await walk(child);
      }
    }
    await walk(dirEntry);
    return files;
  }

  async function selectProjectForFolder(name) {
    const res = await fetch('/api/projects');
    const projects = await res.json();
    const match = projects.find(p => p.title.trim().toLowerCase() === name.trim().toLowerCase());
    if (match) {
      await loadProjects(match.id);
    } else {
      await loadProjects();
      projectSelect.value = '__new__';
      newProjectInput.style.display = 'block';
      newProjectInput.value = name;
    }
  }

  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    dragging = false;
    let folderEntry = null;
    const items = e.dataTransfer.items;
    if (items && items.length) {
      for (const item of items) {
        const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry && entry.isDirectory) { folderEntry = entry; break; }
      }
    }
    if (folderEntry) {
      pinned = true;
      const files = await walkDirectory(folderEntry);
      if (files.length) {
        addFiles(files);
        await selectProjectForFolder(folderEntry.name);
      }
      return;
    }
    if (e.dataTransfer.files.length) {
      pinned = true; // stay open through the upload, like a real drawer would
      addFiles(e.dataTransfer.files);
    }
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --- Upload form (moved from _upload_drawer.html, unchanged logic) ----
  const fileInput = document.getElementById('file-input');
  const stagedList = document.getElementById('staged-list');
  const stagedFilesContainer = document.getElementById('staged-files-container');
  const stagedMoreIndicator = document.getElementById('staged-more-indicator');
  const dropzoneText = document.getElementById('dropzone-text');
  const tagBox = document.getElementById('upload-tag-box');
  const tagAddInput = document.getElementById('upload-tag-add-input');
  const uploadError = document.getElementById('upload-error');
  const submitBtn = document.getElementById('submit-btn');
  const youtubeUrlInput = document.getElementById('youtube-url-input');
  const youtubeAddBtn = document.getElementById('youtube-add-btn');
  const projectSelect = document.getElementById('upload-project-select');
  const newProjectInput = document.getElementById('upload-new-project-input');
  let tags = [];
  let stagedFiles = [];
  let fileStates = [];
  let isUploading = false;
  const MAX_VISIBLE_FILES = 3;
  // Files that have finished (paused briefly, then hidden) or been manually
  // removed mid-batch — indexes into stagedFiles/fileStates. Deliberately
  // NOT spliced out of those arrays: runWithConcurrency's lanes each hold a
  // FIXED index captured when the batch started, and splicing mid-batch
  // would shift every later index down, causing a still-in-flight lane's
  // updateFileStatus call to land on the wrong (shifted) file. Hiding via
  // this set instead keeps indices stable for the whole batch; the arrays
  // only actually shrink/reset between batches, where dismissedIndices is
  // reset alongside them.
  let dismissedIndices = new Set();

  const LINK_URL_RE = /^https?:\/\/.+\..+/i;

  const STATUS_META = {
    queued:          { dot: '#57543F', label: 'Waiting…' },
    uploading:       { dot: '#57543F', label: 'Uploading…' },
    'ocr-pending':   { dot: '#BA7517', label: 'Extracting text…' },
    done:            { dot: '#7FA37C', label: 'Ready' },
    'ocr-failed':    { dot: '#BA7517', label: 'Uploaded — text extraction failed' },
    'upload-failed': { dot: '#E24B4A', label: 'Upload failed' },
  };

  function updateFileStatus(i, status, message, slug) {
    const existingSlug = fileStates[i] && fileStates[i].slug;
    fileStates[i] = { status, message: message || STATUS_META[status].label, slug: slug !== undefined ? slug : existingSlug };
    renderStaged();

    // Pause briefly on the completed state so the user sees the success/
    // failure feedback, then hide it — the next queued file backfills into
    // the visible slots.
    if ((status === 'done' || status === 'ocr-failed') && isUploading) {
      setTimeout(() => {
        dismissedIndices.add(i);
        renderStaged();
      }, 900);
    }
  }

  function updateSubmitButton() {
    if (isUploading) return;
    submitBtn.disabled = stagedFiles.length === 0;
    const fileCount = stagedFiles.filter(f => !f.__isYoutube).length;
    const linkCount = stagedFiles.length - fileCount;
    if (stagedFiles.length === 0) {
      submitBtn.textContent = 'Ingest to Constructicon';
    } else if (linkCount === 0) {
      submitBtn.textContent = fileCount > 1 ? `Ingest ${fileCount} files to Constructicon` : 'Ingest to Constructicon';
    } else if (fileCount === 0) {
      submitBtn.textContent = linkCount > 1 ? `Ingest ${linkCount} links to Constructicon` : 'Ingest link to Constructicon';
    } else {
      submitBtn.textContent = `Ingest ${stagedFiles.length} items to Constructicon`;
    }
  }

  function renderStaged() {
    stagedList.innerHTML = '';
    stagedMoreIndicator.style.display = 'none';
    stagedMoreIndicator.textContent = '';

    const activeIndices = stagedFiles.map((_, idx) => idx).filter(idx => !dismissedIndices.has(idx));

    if (activeIndices.length === 0) {
      stagedFilesContainer.style.display = 'none';
      dropzoneText.textContent = 'Drag files here or click to browse';
    } else {
      stagedFilesContainer.style.display = 'block';
      dropzoneText.textContent = `${activeIndices.length} item${activeIndices.length > 1 ? 's' : ''} staged — drop more or click to add`;

      const visibleIndices = activeIndices.slice(0, MAX_VISIBLE_FILES);
      for (const i of visibleIndices) {
        const file = stagedFiles[i];
        const row = document.createElement('div');
        row.className = 'staged-file';
        row.innerHTML = `
          <div class="staged-thumb">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="16" rx="2" stroke="#57543F" stroke-width="1.4"/>
              <circle cx="8" cy="9" r="1.6" stroke="#57543F" stroke-width="1.4"/>
              <path d="M3 16L8.5 11.5L13 15L16.5 12L21 16" stroke="#57543F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div style="flex:1;min-width:0">
            <div class="staged-name mono"></div>
            <div class="staged-meta"></div>
          </div>
          <button type="button" class="staged-remove">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M6 18L18 6" stroke="#6E6B57" stroke-width="2" stroke-linecap="round"/></svg>
          </button>`;
        row.querySelector('.staged-name').textContent = file.name;
        const state = fileStates[i];
        const metaEl = row.querySelector('.staged-meta');
        if (state) {
          const meta = STATUS_META[state.status];
          let metaHtml = `<span class="staged-status-dot" style="background:${meta.dot}"></span>${state.message}`;
          if (state.status === 'ocr-failed' && state.slug) {
            metaHtml += ` <button type="button" class="staged-retry-ocr-btn" data-index="${i}">Retry</button>`;
          }
          metaEl.innerHTML = metaHtml;
          const retryBtn = metaEl.querySelector('.staged-retry-ocr-btn');
          if (retryBtn) {
            retryBtn.addEventListener('click', (e) => {
              e.preventDefault();
              retryOcrForStagedFile(i);
            });
          }
          if (state.status === 'done' || state.status === 'ocr-failed') {
            row.classList.add('completed');
          }
        } else {
          metaEl.textContent = file.__isYoutube
            ? 'Link — ready to add'
            : `${(file.size / 1024 / 1024).toFixed(1)} MB — ready to upload`;
        }
        const removeBtn = row.querySelector('.staged-remove');
        if (state && (state.status === 'uploading' || state.status === 'ocr-pending')) {
          removeBtn.style.visibility = 'hidden';
        } else {
          removeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (isUploading) {
              dismissedIndices.add(i);
              renderStaged();
            } else {
              stagedFiles.splice(i, 1);
              fileStates.splice(i, 1);
              renderStaged();
              updateSubmitButton();
            }
          });
        }
        stagedList.appendChild(row);
      }

      if (activeIndices.length > MAX_VISIBLE_FILES) {
        const moreCount = activeIndices.length - MAX_VISIBLE_FILES;
        stagedMoreIndicator.textContent = `+ ${moreCount} more queued`;
        stagedMoreIndicator.style.display = 'flex';
      }
    }
    updateSubmitButton();
  }

  function addFiles(fileList) {
    pinned = true;
    showPanel();
    for (const file of fileList) stagedFiles.push(file);
    renderStaged();
  }

  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  function addYoutubeLink() {
    uploadError.style.display = 'none';
    const url = youtubeUrlInput.value.trim();
    if (!url) return;
    if (!LINK_URL_RE.test(url)) {
      uploadError.textContent = "That doesn't look like a valid link — paste a full http:// or https:// URL.";
      uploadError.style.display = 'block';
      return;
    }
    pinned = true;
    showPanel();
    stagedFiles.push({ name: url, size: 0, __isYoutube: true, url });
    youtubeUrlInput.value = '';
    renderStaged();
  }
  youtubeAddBtn.addEventListener('click', (e) => {
    e.preventDefault();
    addYoutubeLink();
  });
  youtubeUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addYoutubeLink();
    }
  });

  // Import from Imgur (#200), mirrored from _upload_drawer.html.
  const imgurImportBtn = document.getElementById('imgur-import-btn');
  const imgurImportStatus = document.getElementById('imgur-import-status');
  imgurImportBtn.addEventListener('click', async () => {
    imgurImportBtn.disabled = true;
    imgurImportBtn.textContent = 'Importing…';
    imgurImportStatus.textContent = '';
    imgurImportStatus.classList.remove('error-text');
    try {
      const res = await fetch('/api/imgur/import', { method: 'POST' });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || 'Import failed');
      imgurImportStatus.textContent = `Imported ${body.imported} new item${body.imported === 1 ? '' : 's'} (${body.skipped} already had, ${body.found} found total).`;
      if (body.imported > 0) {
        document.dispatchEvent(new CustomEvent('constructicon:upload-complete', { detail: { failures: [] } }));
      }
    } catch (err) {
      imgurImportStatus.textContent = err.message;
      imgurImportStatus.classList.add('error-text');
    } finally {
      imgurImportBtn.disabled = false;
      imgurImportBtn.textContent = 'Import from Imgur';
    }
  });

  function renderTags() {
    tagBox.querySelectorAll('.chip').forEach(c => c.remove());
    tags.forEach((tag, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = tag;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '×';
      btn.addEventListener('click', () => { tags.splice(i, 1); renderTags(); });
      chip.appendChild(btn);
      tagBox.insertBefore(chip, tagAddInput);
    });
  }

  // Issue #88: Tag autocomplete from existing tags — a real dropdown, not
  // placeholder text (placeholder is invisible the moment the input has any
  // value, i.e. exactly when suggestions would need to show).
  let allGalleryTags = [];
  fetch('/api/tags').then(res => res.ok ? res.json() : []).then(data => { allGalleryTags = data; }).catch(() => {});

  const tagSuggestions = document.getElementById('upload-tag-suggestions');
  let galleryTagMatches = [];
  let galleryTagActiveIndex = -1;

  function addGalleryTag(value) {
    const trimmed = value.trim();
    if (!trimmed) return;
    tags.push(trimmed);
    tagAddInput.value = '';
    renderTags();
    hideGalleryTagSuggestions();
  }

  function hideGalleryTagSuggestions() {
    tagSuggestions.style.display = 'none';
    tagSuggestions.innerHTML = '';
    galleryTagMatches = [];
    galleryTagActiveIndex = -1;
  }

  function renderGalleryTagSuggestions() {
    tagSuggestions.innerHTML = '';
    if (galleryTagMatches.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'tag-suggestion-empty';
      empty.textContent = 'No matching tags';
      tagSuggestions.appendChild(empty);
    } else {
      galleryTagMatches.forEach((tag, i) => {
        const item = document.createElement('div');
        item.className = 'tag-suggestion-item' + (i === galleryTagActiveIndex ? ' active' : '');
        item.textContent = tag.path;
        item.addEventListener('mousedown', (e) => { e.preventDefault(); addGalleryTag(tag.name); });
        tagSuggestions.appendChild(item);
      });
    }
    tagSuggestions.style.display = 'block';
  }

  function updateGalleryTagSuggestions() {
    const inputValue = tagAddInput.value.trim().toLowerCase();
    if (!inputValue) { hideGalleryTagSuggestions(); return; }
    galleryTagMatches = allGalleryTags
      .filter(tag => tag.name.toLowerCase().includes(inputValue) || tag.path.toLowerCase().includes(inputValue))
      .slice(0, 10);
    galleryTagActiveIndex = -1;
    renderGalleryTagSuggestions();
  }

  tagAddInput.addEventListener('input', updateGalleryTagSuggestions);
  tagAddInput.addEventListener('blur', hideGalleryTagSuggestions);

  tagAddInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && galleryTagMatches.length > 0) {
      e.preventDefault();
      galleryTagActiveIndex = Math.min(galleryTagActiveIndex + 1, galleryTagMatches.length - 1);
      renderGalleryTagSuggestions();
    } else if (e.key === 'ArrowUp' && galleryTagMatches.length > 0) {
      e.preventDefault();
      galleryTagActiveIndex = Math.max(galleryTagActiveIndex - 1, 0);
      renderGalleryTagSuggestions();
    } else if (e.key === 'Enter' && tagAddInput.value.trim()) {
      e.preventDefault();
      if (galleryTagActiveIndex >= 0 && galleryTagMatches[galleryTagActiveIndex]) {
        addGalleryTag(galleryTagMatches[galleryTagActiveIndex].name);
      } else {
        addGalleryTag(tagAddInput.value);
      }
    } else if (e.key === 'Escape') {
      hideGalleryTagSuggestions();
    }
  });

  async function runWithConcurrency(items, limit, worker) {
    const results = new Array(items.length);
    let next = 0;
    async function lane() {
      while (next < items.length) {
        const i = next++;
        results[i] = await worker(items[i], i);
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, lane));
    return results;
  }

  async function pollOcrStatus(slug, timeoutMs = 30000) {
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      await new Promise(r => setTimeout(r, 1200));
      try {
        const res = await fetch(`/api/image/${slug}`);
        if (res.ok) {
          const item = await res.json();
          if (item.ocr_status !== 'pending') return item.ocr_status;
        }
      } catch (e) { /* transient — keep polling */ }
    }
    return 'timeout';
  }

  async function uploadAndTrack(file, i, description, tagList, projectId) {
    updateFileStatus(i, 'uploading');
    const form = new FormData();
    form.append('file', file);
    form.append('description', description);
    form.append('tags', JSON.stringify(tagList));
    form.append('project_id', projectId || '');
    form.append('modified_at', file.lastModified);

    let res;
    try {
      res = await fetch('/api/upload', { method: 'POST', body: form });
    } catch (err) {
      updateFileStatus(i, 'upload-failed', err.message);
      return { ok: false, message: `${file.name}: ${err.message}` };
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({ detail: 'Upload failed' }));
      const prefix = res.status === 409 ? 'Duplicate' : 'Upload failed';
      const message = `${prefix} — ${body.detail || 'unknown error'}`;
      updateFileStatus(i, 'upload-failed', message);
      return { ok: false, message: `${file.name}: ${message}` };
    }

    const item = await res.json();
    if (item.ocr_status !== 'pending') {
      updateFileStatus(i, 'done', undefined, item.slug);
      return { ok: true };
    }
    updateFileStatus(i, 'ocr-pending', undefined, item.slug);
    const finalStatus = await pollOcrStatus(item.slug);
    updateFileStatus(i, finalStatus === 'failed' ? 'ocr-failed' : 'done', undefined, item.slug);
    return { ok: true };
  }

  async function addContentAndTrack(url, i, description, tagList, projectId) {
    updateFileStatus(i, 'uploading', 'Adding link…');
    const form = new FormData();
    form.append('external_url', url);
    form.append('description', description);
    form.append('tags', JSON.stringify(tagList));
    form.append('project_id', projectId || '');

    let res;
    try {
      res = await fetch('/api/content', { method: 'POST', body: form });
    } catch (err) {
      updateFileStatus(i, 'upload-failed', err.message);
      return { ok: false, message: `${url}: ${err.message}` };
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({ detail: 'Failed to add link' }));
      const message = `Failed to add — ${body.detail || 'unknown error'}`;
      updateFileStatus(i, 'upload-failed', message);
      return { ok: false, message: `${url}: ${message}` };
    }

    const item = await res.json();
    if (item.ocr_status !== 'pending') {
      updateFileStatus(i, 'done', undefined, item.slug);
      return { ok: true };
    }
    updateFileStatus(i, 'ocr-pending', undefined, item.slug);
    const finalStatus = await pollOcrStatus(item.slug);
    updateFileStatus(i, finalStatus === 'failed' ? 'ocr-failed' : 'done', undefined, item.slug);
    return { ok: true };
  }

  async function retryOcrForStagedFile(i) {
    const slug = fileStates[i] && fileStates[i].slug;
    if (!slug) return;
    updateFileStatus(i, 'ocr-pending', undefined, slug);
    try {
      const res = await fetch(`/api/image/${slug}/ocr`, { method: 'POST' });
      if (!res.ok) {
        updateFileStatus(i, 'ocr-failed', 'Retry failed to start', slug);
        return;
      }
    } catch (err) {
      updateFileStatus(i, 'ocr-failed', 'Retry failed to start', slug);
      return;
    }
    const finalStatus = await pollOcrStatus(slug);
    updateFileStatus(i, finalStatus === 'failed' ? 'ocr-failed' : 'done', undefined, slug);
  }

  document.getElementById('upload-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    uploadError.style.display = 'none';
    if (!stagedFiles.length || isUploading) return;
    isUploading = true;
    dismissedIndices = new Set();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading...';

    const description = e.target.description.value;
    const tagList = tags.slice();

    let projectId = projectSelect.value;
    if (projectId === '__new__') {
      const newTitle = newProjectInput.value.trim();
      if (!newTitle) {
        isUploading = false;
        submitBtn.disabled = false;
        updateSubmitButton();
        uploadError.textContent = 'Enter a name for the new project, or choose "No project".';
        uploadError.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/api/projects', { method: 'POST', body: new URLSearchParams({ title: newTitle }) });
        if (!res.ok) {
          const body = await res.json().catch(() => ({ detail: 'Failed to create project' }));
          throw new Error(body.detail || 'Failed to create project');
        }
        const project = await res.json();
        projectId = project.id;
        await loadProjects(project.id);
      } catch (err) {
        isUploading = false;
        submitBtn.disabled = false;
        updateSubmitButton();
        uploadError.textContent = `Couldn't create project: ${err.message}`;
        uploadError.style.display = 'block';
        return;
      }
    }

    fileStates = stagedFiles.map(() => ({ status: 'queued', message: STATUS_META.queued.label }));
    renderStaged();

    const results = await runWithConcurrency(stagedFiles, 1, (file, i) =>
      file.__isYoutube
        ? addContentAndTrack(file.url, i, description, tagList, projectId)
        : uploadAndTrack(file, i, description, tagList, projectId)
    );

    tags = [];
    renderTags();
    e.target.reset();
    resetProjectSelect();
    isUploading = false;

    const failures = results.filter(r => !r.ok).map(r => r.message);
    document.dispatchEvent(new CustomEvent('constructicon:upload-complete', { detail: { failures } }));

    if (failures.length === 0) {
      stagedFiles = [];
      fileStates = [];
      dismissedIndices = new Set();
      renderStaged();
      pinned = false;
      scheduleHide(0);
      return;
    }

    // stagedFiles/fileStates are still the full original batch here, indices
    // matching results 1:1 — completed ones were only ever dismissed for
    // display, never spliced out, so this alignment holds.
    const keptFiles = [], keptStates = [];
    stagedFiles.forEach((f, i) => {
      if (!results[i].ok) { keptFiles.push(f); keptStates.push(fileStates[i]); }
    });
    stagedFiles = keptFiles;
    fileStates = keptStates;
    dismissedIndices = new Set();
    renderStaged();
    uploadError.textContent = `Some uploads failed: ${failures.join('; ')}`;
    uploadError.style.display = 'block';
  });

  async function loadProjects(selectId) {
    const res = await fetch('/api/projects');
    const projects = await res.json();
    projectSelect.querySelectorAll('option[data-project]').forEach(o => o.remove());
    const newOption = projectSelect.querySelector('option[value="__new__"]');
    const html = projects.map(p => `<option value="${p.id}" data-project>${escapeHtml(p.title)}</option>`).join('');
    if (newOption) newOption.insertAdjacentHTML('beforebegin', html);
    else projectSelect.insertAdjacentHTML('beforeend', html + '<option value="__new__">+ New project…</option>');
    if (selectId !== undefined) projectSelect.value = String(selectId);
  }
  function resetProjectSelect() {
    projectSelect.value = '';
    newProjectInput.style.display = 'none';
    newProjectInput.value = '';
  }
  projectSelect.addEventListener('change', () => {
    const isNew = projectSelect.value === '__new__';
    newProjectInput.style.display = isNew ? 'block' : 'none';
    if (isNew) newProjectInput.focus();
  });
  loadProjects();

})();
</script>
