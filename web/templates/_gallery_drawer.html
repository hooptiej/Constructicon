<!-- Upload pop-out — home page only, hides behind a tab on the right edge
     (avatar + owner name) and reveals on mouse-over or drag-over. Originally
     #17's combined gallery + upload panel; the embedded gallery section
     (its own duplicated ~885-line copy of gallery-browsing markup/JS) was
     removed once the Unfiled page, home page's own Files widget, and the
     standalone /gallery page made it redundant — this is upload-only now,
     same content as _upload_drawer.html (used by every other page) but
     reached via hover/drag instead of a click. Other pages (gallery.html,
     account.html, object_detail.html, project_detail.html, user_gallery.html)
     are unaffected — they keep the click-triggered _upload_drawer.html.

     Timing/easing (0.2s ease, transform+opacity) is picked to sit between
     _upload_drawer.html's original slide (0.22s ease) and _admin_pane.html's
     popover (#24, 0.18s ease) so the two pop-out surfaces on this page read
     as one family despite different shapes/triggers: admin pane is a small
     click-toggled popover bottom-right, this is a hover/drag-revealed full
     -height edge panel on the right-middle. No shared backdrop dim, matching
     admin pane's no-backdrop convention (a full-page dim on every mouse
     hover would be obnoxious) — closing happens on mouse-leave, drag-leave,
     Escape, or (once opened by a click) an outside click. -->
<div class="gallery-drawer-tab" id="gallery-drawer-tab" title="Upload" role="button" tabindex="0">
  <div class="gallery-drawer-avatar">{{ owner_initials }}</div>
  <span class="gallery-drawer-name">{{ owner_name }}</span>
</div>
<div class="gallery-drawer" id="gallery-drawer">
  <div>
    <h2 class="gallery-drawer-section-title">Upload</h2>
    <form id="upload-form">
      <p class="error-text" id="upload-error" style="display:none;margin-bottom:12px"></p>
      <button class="btn-primary" type="submit" id="submit-btn" style="margin-bottom:14px" disabled>Ingest to Constructicon</button>
      <label class="dropzone" id="dropzone" for="file-input">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 16V6M12 6L8 10M12 6L16 10" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 17H6.5C4.567 17 3 15.433 3 13.5C3 11.766 4.257 10.325 5.912 10.052C6.278 7.749 8.267 6 10.667 6C12.822 6 14.66 7.403 15.29 9.35" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 17H17.5C19.433 17 21 15.433 21 13.5C21 11.766 19.743 10.325 18.088 10.052" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="dropzone-text" id="dropzone-text">Drag files here or click to browse</div>
        <div class="dropzone-hint">PNG, JPG, PDF, STL, PSD, SVG, EPS, or audio (MP3/M4A/OGG/WAV) up to 25MB — drop multiple at once</div>
        <input type="file" id="file-input" name="file" accept=".png,.jpg,.jpeg,.pdf,.stl,.psd,.svg,.eps,.mp3,.m4a,.ogg,.wav" multiple style="display:none">
      </label>
      <div class="divider" style="margin:14px 0">
        <div class="line"></div><span>OR</span><div class="line"></div>
      </div>
      <div class="field">
        <!-- Issue #203, mirrored from _upload_drawer.html: hidden behind
             a toggle button, and Imgur-aware (see addYoutubeLink below) —
             one link field for every link-shaped add, not a separate one
             per source. -->
        <button type="button" class="btn-secondary link-toggle-btn" id="link-toggle-btn" style="width:100%">+ Add a link</button>
        <div class="youtube-add-row" id="youtube-add-row" style="display:none;margin-top:8px">
          <input class="input mono" id="youtube-url-input" placeholder="Any URL — YouTube, Imgur, or any other web page">
          <button type="button" class="btn-secondary" id="youtube-add-btn">Add</button>
        </div>
      </div>
      <div class="field">
        <!-- Issue #200, mirrored from _upload_drawer.html -->
        <button type="button" class="btn-secondary" id="imgur-import-btn" style="width:100%">Import from Imgur</button>
        <div class="dropzone-hint" id="imgur-import-status" style="margin-top:6px"></div>
      </div>
      <div id="staged-files-container" class="staged-files-container">
        <div id="staged-list"></div>
        <div id="staged-more-indicator" class="staged-more-indicator" style="display:none"></div>
      </div>
      <div class="meta-form">
        <div class="field">
          <label>DESCRIPTION</label>
          <textarea class="input" name="description" rows="3" placeholder="What does this show?"></textarea>
        </div>
        <div class="field">
          <label>TAGS</label>
          <div class="tag-input-box" id="upload-tag-box">
            <input class="tag-add-input" id="upload-tag-add-input" placeholder="+ Add tag, press Enter" autocomplete="off">
            <div class="tag-suggestions" id="upload-tag-suggestions" style="display:none"></div>
          </div>
        </div>
        <div class="field">
          <label>PROJECT <span class="optional">(optional)</span></label>
          <select class="input" id="upload-project-select">
            <option value="">No project</option>
          </select>
          <input class="input mono" id="upload-new-project-input" placeholder="New project name" style="display:none;margin-top:6px">
        </div>
      </div>
    </form>
  </div>
</div>
<script src="/static/js/ingest.js?v={{ static_version('js/ingest.js') }}"></script>
<script>
// Staging/upload/tag/folder-drop logic lives in web/static/js/ingest.js
// (#229 -- used to be an ~800-line near-duplicate of _upload_drawer.html's
// own copy); this is just this page's own hover/pin pop-out state machine
// and drag-and-drop wiring around that shared controller.
(function () {
  // --- Pop-out open/close state machine (#17) ---------------------------
  // Open whenever any of: pinned (explicit click, or an active/staged
  // upload), dragging (a file is being dragged over the window), or the
  // mouse is actually over the tab/panel. mouseleave/dragleave don't close
  // immediately — they schedule a check shortly after, so moving the mouse
  // from the tab into the panel (or briefly outside during a drag) doesn't
  // flicker it shut.
  const tab = document.getElementById('gallery-drawer-tab');
  const panel = document.getElementById('gallery-drawer');
  const headerUploadTrigger = document.getElementById('upload-trigger'); // from _header.html, if present
  let pinned = false;
  let dragging = false;
  let closeTimer = null;

  function showPanel() {
    clearTimeout(closeTimer);
    panel.classList.add('open');
    tab.classList.add('active');
  }
  function scheduleHide(delay) {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
      if (pinned || dragging) return;
      if (tab.matches(':hover') || panel.matches(':hover')) return;
      panel.classList.remove('open');
      tab.classList.remove('active');
    }, delay === undefined ? 220 : delay);
  }
  function togglePinned() {
    pinned = !pinned;
    if (pinned) showPanel(); else scheduleHide(0);
  }

  tab.addEventListener('mouseenter', showPanel);
  tab.addEventListener('mouseleave', () => scheduleHide());
  tab.addEventListener('click', togglePinned);
  tab.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePinned(); } });
  panel.addEventListener('mouseenter', () => clearTimeout(closeTimer));
  panel.addEventListener('mouseleave', () => scheduleHide());
  if (headerUploadTrigger) headerUploadTrigger.addEventListener('click', togglePinned);

  document.addEventListener('click', (e) => {
    if (!pinned) return;
    // Ignore the click that just opened it — the tab's own click handler
    // (or the header's Upload button, which lives outside both tab and
    // panel) already ran togglePinned() for this same event before it
    // bubbles up here.
    if (panel.contains(e.target) || tab.contains(e.target)) return;
    if (headerUploadTrigger && headerUploadTrigger.contains(e.target)) return;
    pinned = false;
    scheduleHide(0);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    pinned = false;
    dragging = false;
    scheduleHide(0);
  });

  const ingest = createIngestController({ onOpen: () => { pinned = true; showPanel(); } });
  document.addEventListener('constructicon:upload-complete', (e) => {
    if (e.detail.failures.length === 0) {
      pinned = false;
      scheduleHide(0);
    }
  });

  // The whole window is a drop target — dragging a file in from anywhere
  // reveals this pop-out (same depth-counter technique _upload_drawer.html
  // used for its own drag-to-open, retargeted at this combined panel so
  // drag-over behaves the same as it always has, just landing here now).
  let dragDepth = 0;
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    dragging = true;
    showPanel();
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) {
      dragging = false;
      scheduleHide();
    }
  });

  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    dragging = false;
    let folderEntry = null;
    const items = e.dataTransfer.items;
    if (items && items.length) {
      for (const item of items) {
        const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry && entry.isDirectory) { folderEntry = entry; break; }
      }
    }
    if (folderEntry) {
      pinned = true;
      const files = await ingest.walkDirectory(folderEntry);
      if (files.length) {
        await ingest.addFiles(files, folderEntry.name);
        await ingest.selectProjectForFolder(folderEntry.name);
      }
      return;
    }
    if (e.dataTransfer.files.length) {
      pinned = true; // stay open through the upload, like a real drawer would
      ingest.addFiles(e.dataTransfer.files);
    }
  });
})();
</script>
