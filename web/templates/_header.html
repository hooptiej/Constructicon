<div class="app-header">
  <a class="brand" href="/gallery">
    {% include "_logo.html" %}
    <span class="brand-name">Image Repo</span>
  </a>
  <div style="display:flex;align-items:center;gap:14px;">
    <button type="button" class="upload-trigger" id="upload-trigger">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="#ECE8DA" stroke-width="1.8" stroke-linecap="round"/></svg>
      Upload
    </button>
    <div class="online-avatars" id="online-avatars" title="Who's online"></div>
    <div class="avatar-wrap">
      <button class="avatar" id="avatar-btn" title="{{ user_email }}" type="button">
        <svg id="avatar-btn-icon-default" width="15" height="15" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3.4" stroke="#A8A48F" stroke-width="1.5"/>
          <path d="M5 20C5 16.4 8 14 12 14C16 14 19 16.4 19 20" stroke="#A8A48F" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <img id="avatar-btn-img" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">
      </button>
      <div class="avatar-menu" id="avatar-menu">
        <div class="avatar-menu-identity">
          <div class="avatar-menu-display-name" id="avatar-menu-display-name" style="display:none"></div>
          <div class="avatar-menu-email" id="avatar-menu-email">{{ user_email }}</div>
        </div>
        <a href="/account">Account settings</a>
        <form method="post" action="/auth/logout">
          <button type="submit">Log out</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const btn = document.getElementById('avatar-btn');
  const menu = document.getElementById('avatar-menu');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target)) menu.classList.remove('open');
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const ONLINE_PALETTE = ["#B98B5E", "#8B7355", "#C9A66B", "#7FA37C", "#9CAD5E", "#6B8FA3", "#A36B8F"];
  function colorForEmail(email) {
    let hash = 0;
    for (let i = 0; i < email.length; i++) hash = (hash * 31 + email.charCodeAt(i)) >>> 0;
    return ONLINE_PALETTE[hash % ONLINE_PALETTE.length];
  }

  const selfEmail = {{ user_email | tojson }};
  const onlineEl = document.getElementById('online-avatars');
  async function refreshOnline() {
    try {
      const res = await fetch('/api/online');
      const data = await res.json();
      const onlineSet = new Set(data.online);
      const others = data.known.filter(u => u.email !== selfEmail);
      // Online people first (most relevant), offline people trail behind, dimmed.
      others.sort((a, b) => (onlineSet.has(b.email) ? 1 : 0) - (onlineSet.has(a.email) ? 1 : 0));
      onlineEl.innerHTML = others.map(u => {
        const isOnline = onlineSet.has(u.email);
        const bg = u.avatar_color || colorForEmail(u.email);
        const content = u.avatar_url
          ? `<img src="${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : u.email[0].toUpperCase();
        return `<div class="online-avatar ${isOnline ? '' : 'is-offline'}" style="background:${bg}" title="${escapeHtml(u.display_name + ' — ' + (isOnline ? 'online' : 'offline'))}">
          ${content}
          <span class="presence-dot ${isOnline ? 'online' : 'offline'}"></span>
        </div>`;
      }).join('');
    } catch (e) { /* transient network hiccup — next poll retries */ }
  }
  refreshOnline();
  setInterval(refreshOnline, 20000);

  async function loadSelfProfile() {
    try {
      const res = await fetch('/api/profile');
      const profile = await res.json();
      if (profile.display_name) {
        const nameEl = document.getElementById('avatar-menu-display-name');
        nameEl.textContent = profile.display_name;
        nameEl.style.display = 'block';
      }
      if (profile.avatar_url) {
        document.getElementById('avatar-btn-icon-default').style.display = 'none';
        const img = document.getElementById('avatar-btn-img');
        img.src = profile.avatar_url;
        img.style.display = 'block';
      }
      if (profile.avatar_color) {
        btn.style.background = profile.avatar_color;
      }
    } catch (e) { /* fall back to defaults already rendered */ }
  }
  loadSelfProfile();
})();
</script>
