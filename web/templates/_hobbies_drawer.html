<!-- Hobbies (#345) — the /hobbies page as a wide slide-out drawer, reachable
     from the nav rail on every page (was a navigate link, which read as
     inconsistent among the drawer tabs). Included globally from base.html.
     Cards load lazily on first open; clicking one navigates to its /hobby page.
     The standalone /hobbies page/route still exists as a direct-URL fallback.
     #686: the cards are the shared card component (_hobby_cards.html), fetched as a
     server-rendered fragment (GET /api/hobbies/html); behaviour in static/js/hobbies.js. -->
<button type="button" id="hobbies-drawer-trigger" style="display:none" aria-hidden="true" tabindex="-1"></button>
<div class="drawer-backdrop" id="hobbies-drawer-backdrop"></div>
<div class="wide-drawer hobbies-drawer" id="hobbies-drawer" role="dialog" aria-label="Hobbies">
  <div class="wide-drawer-header">
    <h2>Hobbies</h2>
    <button type="button" class="modal-close" id="hobbies-drawer-close" aria-label="Close">&times;</button>
  </div>
  <p class="page-subtitle">Collections organized by hobby interest.</p>
  <div style="margin-bottom:16px">
    <button type="button" class="btn-secondary" id="hobbies-drawer-new" title="Create a new hobby">+ New hobby</button>
  </div>
  <p class="empty-state" id="hobbies-drawer-status" role="status" hidden></p>
  <div id="hobbies-drawer-grid"></div>
</div>
<script src="/static/js/hobbies.js?v={{ static_version('js/hobbies.js') }}" defer></script>
