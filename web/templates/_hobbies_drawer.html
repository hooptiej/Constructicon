<!-- Hobbies (#345) — the /hobbies page as a wide slide-out drawer, reachable
     from the nav rail on every page (was a navigate link, which read as
     inconsistent among the drawer tabs). Included globally from base.html.
     Cards load lazily on first open; clicking one navigates to its /hobby page.
     The standalone /hobbies page/route still exists as a direct-URL fallback. -->
<button type="button" id="hobbies-drawer-trigger" style="display:none" aria-hidden="true" tabindex="-1"></button>
<div class="drawer-backdrop" id="hobbies-drawer-backdrop"></div>
<div class="wide-drawer hobbies-drawer" id="hobbies-drawer" role="dialog" aria-label="Hobbies">
  <div class="wide-drawer-header">
    <h2>Hobbies</h2>
    <button type="button" class="modal-close" id="hobbies-drawer-close" aria-label="Close">&times;</button>
  </div>
  <p class="page-subtitle">Collections organized by hobby interest.</p>
  <div style="margin-bottom:16px">
    <button type="button" class="btn-secondary" id="hobbies-drawer-new" title="Create a new hobby">+ New hobby</button>
  </div>
  <div id="hobbies-drawer-grid" class="gallery-grid"></div>
  <p id="hobbies-drawer-empty" class="empty-state" style="display:none">No hobbies yet.</p>
</div>

<script>
(function () {
  const backdrop = document.getElementById('hobbies-drawer-backdrop');
  const drawer = document.getElementById('hobbies-drawer');
  const trigger = document.getElementById('hobbies-drawer-trigger');
  const closeBtn = document.getElementById('hobbies-drawer-close');
  const newBtn = document.getElementById('hobbies-drawer-new');
  let loaded = false;

  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function loadHobbies() {
    try {
      const res = await fetch('/api/hobbies');
      if (!res.ok) return;
      const hobbies = await res.json();
      const grid = document.getElementById('hobbies-drawer-grid');
      const empty = document.getElementById('hobbies-drawer-empty');

      if (!hobbies.length) {
        empty.style.display = 'block';
        grid.innerHTML = '';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = hobbies.map((hobby) => `
        <div class="project-item-card-wrapper">
          <a class="project-item-card" href="/hobby/${encodeURIComponent(hobby.slug)}">
            <div class="project-item-thumb">
              <div class="project-cover-placeholder"></div>
            </div>
            <div class="project-item-body">
              <div class="project-item-title">${esc(hobby.name)}</div>
              <div class="project-item-meta">
                <span style="display:inline-block;padding:2px 6px;background:rgba(127,163,124,0.2);border-radius:2px;font-size:11px;color:#7FA37C;margin-right:4px">${esc(hobby.hobby_status || 'active')}</span>
                ${hobby.project_count || 0} project${hobby.project_count === 1 ? '' : 's'}
              </div>
            </div>
          </a>
        </div>
      `).join('');
    } catch (err) {
      console.error('Failed to load hobbies:', err);
    }
  }

  function openDrawer() {
    drawer.classList.add('open');
    backdrop.classList.add('open');
    if (!loaded) { loaded = true; loadHobbies(); }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
  }

  if (trigger) trigger.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  newBtn.addEventListener('click', async () => {
    const name = prompt('New hobby name:');
    if (!name || !name.trim()) return;
    const fd = new FormData();
    fd.append('name', name.trim());
    const res = await fetch('/api/hobbies', { method: 'POST', body: fd });
    if (res.ok) {
      const hobby = await res.json();
      window.location.href = `/hobby/${encodeURIComponent(hobby.slug)}`;
    } else {
      alert('Failed to create hobby.');
    }
  });
})();
</script>
