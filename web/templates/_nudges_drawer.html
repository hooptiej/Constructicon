<!-- Curator drawer (#345, #519) — the one queue of everything that needs the owner: stored
     questions, the Curator's nudges and computed needs, grouped by card (Active cards first, then
     most recently touched) with a trailing Deferred section. The list is server-rendered
     (_curation_queue.html) and wired by static/js/curator-queue.js; the count badge on the Curator
     tab (_nav_tabs.html) counts open, non-deferred items from the same queue. The fragment loads
     on first open and again on every open or constructicon:needs-changed. -->
<button type="button" id="nudges-drawer-trigger" style="display:none" aria-hidden="true" tabindex="-1"></button>
<div class="drawer-backdrop" id="nudges-drawer-backdrop"></div>
<div class="wide-drawer nudges-drawer" id="nudges-drawer" role="dialog" aria-label="Curator">
  <div class="wide-drawer-header">
    <h2>Curator <span id="nudges-drawer-count" class="apikey-status"></span></h2>
    <button type="button" class="modal-close" id="nudges-drawer-close" aria-label="Close">&times;</button>
  </div>
  <p class="page-subtitle">Everything waiting on you, grouped by card: questions, suggestions and gaps. <a href="/curator">Open the full Curator page</a></p>
  <div id="nudges-drawer-list" class="cq-mount"></div>
</div>

<script>
(function () {
  const backdrop = document.getElementById('nudges-drawer-backdrop');
  const drawer = document.getElementById('nudges-drawer');
  const trigger = document.getElementById('nudges-drawer-trigger');
  const closeBtn = document.getElementById('nudges-drawer-close');
  const list = document.getElementById('nudges-drawer-list');
  const count = document.getElementById('nudges-drawer-count');
  let queue = null;

  function openDrawer() {
    drawer.classList.add('open');
    backdrop.classList.add('open');
    if (!queue && window.CuratorQueue) {
      queue = window.CuratorQueue.mount(list, {
        onCount: (open) => { count.textContent = open ? `(${open})` : ''; }
      });
    } else if (queue) {
      queue.reload();  // refresh on every open so the list is current
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
  }

  if (trigger) trigger.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });
})();
</script>
