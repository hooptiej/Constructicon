<!-- Processing drawer (#388) — shows in-flight post-upload work: OCR /
     captioning / embedding per item. Global view of everything the box is
     still chewing, however it was uploaded (drawer, MCP, bulk script), with
     the items this browser just submitted (localStorage) highlighted at the
     top. Included globally from base.html. Polls GET /api/processing; no
     status is stored just for this.
     #774: its tab (#proc-tab, badge #proc-tab-badge, .idle when nothing is
     in flight) is no longer its own left-edge button here: it is the
     "processing" entry in _nav_tabs.html's NAV_TABS (right rail, after
     Upload), which base.html includes BEFORE this file so the script below
     finds it. The drawer now slides in from the right, matching its tab. -->
<div class="drawer-backdrop" id="proc-backdrop"></div>
<div class="proc-drawer" id="proc-drawer" role="dialog" aria-label="Processing">
  <div class="proc-drawer-header">
    <h2>Processing</h2>
    <button type="button" class="modal-close" id="proc-close" aria-label="Close">&times;</button>
  </div>
  <p class="page-subtitle">Uploads still being chewed — OCR, captioning, embedding.</p>
  <p class="proc-note" id="proc-captions-off" style="display:none">Captions are off on this install, so images aren't captioned automatically. They count as settled once OCR is done. An agent can still caption them through the MCP tools.</p>
  <div class="proc-list" id="proc-list"></div>
  <p class="proc-empty" id="proc-empty" style="display:none">All caught up — nothing processing.</p>
</div>

<script nonce="{{ csp_nonce() }}">
(function () {
  const tab = document.getElementById('proc-tab');
  const badge = document.getElementById('proc-tab-badge');
  // #774: the tab lives in the nav rail now. If it's ever missing (NAV_TABS
  // lost its entry, or the include order changed), say so plainly instead of
  // dying on a null with a vague TypeError.
  if (!tab || !badge) {
    console.error('Processing drawer (#774): #proc-tab / #proc-tab-badge not found. ' +
      'Check the "processing" entry in _nav_tabs.html NAV_TABS, and that base.html ' +
      'includes _nav_tabs.html before _processing_drawer.html.');
    return;
  }
  const drawer = document.getElementById('proc-drawer');
  const backdrop = document.getElementById('proc-backdrop');
  const closeBtn = document.getElementById('proc-close');
  const list = document.getElementById('proc-list');
  const empty = document.getElementById('proc-empty');
  const capsOff = document.getElementById('proc-captions-off');
  const SKEY = 'ctc_processing_session';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function sessionSlugs() {
    try {
      const a = JSON.parse(localStorage.getItem(SKEY) || '[]');
      const cut = Date.now() - 86400000; // drop entries older than a day
      const keep = a.filter(x => x && x.ts > cut);
      if (keep.length !== a.length) localStorage.setItem(SKEY, JSON.stringify(keep));
      return keep.map(x => x.slug);
    } catch (e) { return []; }
  }

  function stageHtml(st) {
    const label = st.state === 'failed' ? esc(st.stage) + ' failed' : st.state === 'off' ? esc(st.stage) + ' off' : esc(st.stage);
    // #724: an OCR stage that is "off" because the item is not compatible says why on hover; (b2) so
    // does a failed one (a corrupt file) and a done one that came with a warning, each in its own words.
    const NOTE_PREFIX = { off: 'Not compatible with OCR: ', failed: 'OCR failed: ', done: 'Read with a warning: ' };
    const title = st.note ? ` title="${esc((NOTE_PREFIX[st.state] || '') + st.note)}"` : '';
    return `<span class="proc-stage ${esc(st.state)}"${title}><span class="proc-stage-dot"></span>${label}</span>`;
  }

  function render(data) {
    const items = (data && data.items) || [];
    const n = (data && data.count) || 0;
    badge.textContent = n > 99 ? '99+' : n;
    badge.hidden = n === 0;
    capsOff.style.display = (data && data.captions_disabled) ? 'block' : 'none';  // #585
    tab.classList.toggle('idle', n === 0);
    if (!items.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    list.innerHTML = items.map(it => `
      <div class="proc-item ${it.is_session ? 'is-session' : ''}">
        <div class="proc-item-name">${esc(it.name)}</div>
        <div class="proc-stages">${
          (it.stages || []).map(stageHtml).join('') ||
          '<span class="proc-stage done"><span class="proc-stage-dot"></span>done</span>'
        }</div>
      </div>`).join('');
  }

  let polling = false;
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const s = sessionSlugs();
      const url = '/api/processing' + (s.length ? '?session=' + encodeURIComponent(s.join(',')) : '');
      const res = await fetch(url);
      if (res.ok) render(await res.json());
    } catch (e) { /* transient — next tick retries */ }
    finally { polling = false; }
  }

  function openDrawer() { drawer.classList.add('open'); backdrop.classList.add('open'); poll(); }
  function closeDrawer() { drawer.classList.remove('open'); backdrop.classList.remove('open'); }

  tab.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });
  // ingest.js fires this right after a submit registers new slugs.
  document.addEventListener('constructicon:processing-added', openDrawer);

  poll();
  setInterval(poll, 3000);
})();
</script>
