<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="upload-drawer" id="upload-drawer">
  <div class="upload-drawer-header">
    <h2>Upload</h2>
    <button type="button" class="modal-close" id="drawer-close">&times;</button>
  </div>
  <form id="upload-form">
    <p class="error-text" id="upload-error" style="display:none;margin-bottom:12px"></p>
    <button class="btn-primary" type="submit" id="submit-btn" style="margin-bottom:14px" disabled>Ingest to Constructicon</button>
    <label class="dropzone" id="dropzone" for="file-input">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 16V6M12 6L8 10M12 6L16 10" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 17H6.5C4.567 17 3 15.433 3 13.5C3 11.766 4.257 10.325 5.912 10.052C6.278 7.749 8.267 6 10.667 6C12.822 6 14.66 7.403 15.29 9.35" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17 17H17.5C19.433 17 21 15.433 21 13.5C21 11.766 19.743 10.325 18.088 10.052" stroke="#6E6B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="dropzone-text" id="dropzone-text">Drag files here or click to browse</div>
      <div class="dropzone-hint">PNG, JPG, PDF, STL, PSD, SVG, EPS, or audio (MP3/M4A/OGG/WAV) up to 25MB — drop multiple at once</div>
      <input type="file" id="file-input" name="file" accept=".png,.jpg,.jpeg,.pdf,.stl,.psd,.svg,.eps,.mp3,.m4a,.ogg,.wav" multiple style="display:none">
    </label>
    <div class="divider" style="margin:14px 0">
      <div class="line"></div><span>OR</span><div class="line"></div>
    </div>
    <div class="field">
      <!-- A URL field stays hidden behind a toggle button rather than
           sitting always-open (issue #203). Handles a plain YouTube/web
           link (#184) AND an Imgur post/album link, the same "paste any
           URL, let the server figure out what it is" pattern either way —
           see addYoutubeLink below for the client-side Imgur detection
           that routes a staged item to /api/imgur/import-url instead of
           /api/content at submit time. Deliberately ONE input for every
           link-shaped add, not a separate field per source. -->
      <button type="button" class="btn-secondary link-toggle-btn" id="link-toggle-btn" style="width:100%">+ Add a link</button>
      <div class="youtube-add-row" id="youtube-add-row" style="display:none;margin-top:8px">
        <input class="input mono" id="youtube-url-input" placeholder="Any URL — YouTube, Imgur, or any other web page">
        <button type="button" class="btn-secondary" id="youtube-add-btn">Add</button>
      </div>
    </div>
    <div class="field">
      <!-- Issue #200: pulls every new public-gallery submission from the
           owner's Imgur account (Client-ID + username set in the admin
           pane) in one server-side round trip — no staging, no per-item
           progress in this drawer's staged-list UI, since the whole batch
           either lands or reports one error. A fundamentally different
           action from the link field above (no URL to type, just "pull
           everything new"), so it stays its own button rather than
           folding into the link field too. -->
      <button type="button" class="btn-secondary" id="imgur-import-btn" style="width:100%">Import from Imgur</button>
      <div class="dropzone-hint" id="imgur-import-status" style="margin-top:6px"></div>
    </div>
    <div id="staged-files-container" class="staged-files-container">
      <div id="staged-list"></div>
      <div id="staged-more-indicator" class="staged-more-indicator" style="display:none"></div>
    </div>
    <div class="meta-form">
      <div class="field">
        <label>DESCRIPTION</label>
        <textarea class="input" name="description" rows="3" placeholder="What does this show?"></textarea>
      </div>
      <div class="field">
        <label>TAGS</label>
        <div class="tag-input-box" id="upload-tag-box">
          <input class="tag-add-input" id="upload-tag-add-input" placeholder="+ Add tag, press Enter" autocomplete="off">
          <div class="tag-suggestions" id="upload-tag-suggestions" style="display:none"></div>
        </div>
      </div>
      <div class="field">
        <label>PROJECT <span class="optional">(optional)</span></label>
        <select class="input" id="upload-project-select">
          <option value="">No project</option>
        </select>
        <input class="input mono" id="upload-new-project-input" placeholder="New project name" style="display:none;margin-top:6px">
      </div>
    </div>
  </form>
</div>
<script src="/static/js/ingest.js?v={{ static_version('js/ingest.js') }}"></script>
<script>
// --- Upload drawer: shared across every authenticated page. On success,
// dispatches "constructicon:upload-complete" on document ({detail:{failures}})
// so each page can refresh its own data however makes sense for it.
// Staging/upload/tag/folder-drop logic lives in web/static/js/ingest.js
// (#229 -- used to be an ~800-line near-duplicate of _gallery_drawer.html's
// own copy); this is just this page's own open/close mechanics and drag-
// and-drop wiring around that shared controller.
(function () {
  const drawer = document.getElementById('upload-drawer');
  const drawerBackdrop = document.getElementById('drawer-backdrop');
  function openDrawer() { drawer.classList.add('open'); drawerBackdrop.classList.add('open'); }
  function closeDrawer() { drawer.classList.remove('open'); drawerBackdrop.classList.remove('open'); }
  const uploadTrigger = document.getElementById('upload-trigger');
  if (uploadTrigger) uploadTrigger.addEventListener('click', openDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

  const ingest = createIngestController({ onOpen: openDrawer });
  document.addEventListener('constructicon:upload-complete', (e) => {
    if (e.detail.failures.length === 0) closeDrawer();
  });

  // The whole window is a drop target on every page — dragging a file in
  // from anywhere slides the upload drawer open; dropping stages it there.
  let dragDepth = 0;
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    openDrawer();
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
  });

  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    let folderEntry = null;
    const items = e.dataTransfer.items;
    if (items && items.length) {
      for (const item of items) {
        const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry && entry.isDirectory) { folderEntry = entry; break; }
      }
    }
    if (folderEntry) {
      const files = await ingest.walkDirectory(folderEntry);
      if (files.length) {
        // #240: the server matches this name against existing tags/projects
        // too (sent as folder_name on each /api/upload — see ingest.js's
        // uploadAndTrack), independent of the project auto-select below.
        await ingest.addFiles(files, folderEntry.name);
        await ingest.selectProjectForFolder(folderEntry.name);
      }
      return;
    }
    if (e.dataTransfer.files.length) ingest.addFiles(e.dataTransfer.files);
  });
})();
</script>
