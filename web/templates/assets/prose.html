{# #450/#471: shared asset: readable prose styles for rendered Markdown.
   .markdown-body = typography only (usable inside any container, e.g. the
   project page's write-up box); .markdown-file = the standalone scroll box
   a .md file's / document's object-page preview sits in. #}
<style>
  .markdown-body {
    text-align: left;
    color: var(--text, #e8e8e8);
    font-size: 15px;
    line-height: 1.65;
    white-space: normal;
  }
  .markdown-file {
    max-width: 760px;
    max-height: 70vh;
    overflow: auto;
    padding: 24px 32px;
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.4em 0 0.5em; line-height: 1.25; }
  .markdown-body h1 { font-size: 1.7em; }
  .markdown-body h2 { font-size: 1.35em; border-bottom: 1px solid var(--border, #2A2A2A); padding-bottom: 0.25em; }
  .markdown-body h3 { font-size: 1.15em; }
  .markdown-body > :first-child { margin-top: 0; }
  .markdown-body p, .markdown-body ul, .markdown-body ol, .markdown-body blockquote,
  .markdown-body pre, .markdown-body table { margin: 0 0 1em; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.6em; }
  .markdown-body a { color: var(--accent, #7aa2f7); }
  .markdown-body blockquote { border-left: 3px solid var(--border, #2A2A2A); padding-left: 1em; color: var(--text-2, #aaa); }
  .markdown-body code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.9em; background: var(--surface, #1c1c1c); padding: 0.1em 0.3em; border-radius: 4px; }
  .markdown-body pre { background: var(--surface, #1c1c1c); padding: 12px 14px; border-radius: 8px; overflow: auto; }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body table { border-collapse: collapse; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border, #2A2A2A); padding: 4px 10px; }
  .markdown-body img { max-width: 100%; }
  .markdown-body hr { border: none; border-top: 1px solid var(--border, #2A2A2A); }
</style>
